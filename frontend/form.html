<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fill Your Form — Voice Form Assistant</title>
  <meta name="description" content="Answer each form field using your voice or keyboard. Voice guidance in your language." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/form.css" />
</head>
<body>

  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="container">
      <a href="index.html" class="navbar-brand">🎙️ VoiceForm</a>
      <div style="display:flex; align-items:center; gap:20px;">
        <div class="navbar-lang">
          <span id="nav-lang-label">Language:</span> <span id="nav-lang-display">English</span>
        </div>
        <a href="dashboard.html" class="btn btn-ghost btn-sm" id="nav-back-btn" aria-label="Go back to upload">
          ← Back
        </a>
      </div>
    </div>
  </nav>

  <!-- Spinner -->
  <div class="spinner-overlay" id="spinner" role="status" aria-label="Loading">
    <div class="spinner"></div>
    <span class="spinner-text" id="spinner-text">Loading your form…</span>
  </div>

  <!-- Main layout -->
  <div class="form-page-wrapper">
    <div class="container">

      <!-- Form header -->
      <header class="form-header">
        <h1 class="form-title-text" id="form-title-display">Loading form…</h1>
        <div class="form-progress-info">
          <span class="form-progress-label" id="progress-label">Field 1 of —</span>
          <span class="form-progress-pct" id="progress-pct">0%</span>
        </div>
        <div class="progress-bar-track" role="progressbar"
          aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"
          aria-label="Form completion progress" id="progress-bar-wrapper">
          <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
        </div>
      </header>

      <!-- Form layout: question card + sidebar -->
      <div class="form-layout">

        <!-- Main question area -->
        <main>
          <!-- Voice Guidance Bar -->
          <div class="voice-assistant-banner" id="voice-assistant-bar">
            <div class="voice-assistant-left">
              <span class="voice-pulse-dot" aria-hidden="true"></span>
              <span class="voice-assistant-title" id="voice-assistant-title">🎙️ AI Voice Guide</span>
            </div>
            <div class="voice-assistant-actions">
              <button class="btn btn-sm btn-ghost voice-help-btn" id="voice-help-btn" aria-label="Listen to voice instructions on how to fill the form">
                🔊 How to Fill
              </button>
              <button class="btn btn-sm btn-ghost voice-auto-toggle active" id="auto-speak-btn" aria-pressed="true" aria-label="Toggle auto-reading questions">
                🔊 Auto-read: ON
              </button>
            </div>
          </div>

          <div class="question-card" id="question-card" aria-live="polite">
            <!-- Dynamically rendered by form.js -->
            <div style="text-align:center; color:var(--text-muted); padding: 40px 0;">
              <div class="spinner" style="margin:0 auto 16px;"></div>
              <p>Loading question…</p>
            </div>
          </div>

          <!-- Navigation -->
          <div class="form-nav" style="margin-top: 24px;">
            <button class="btn btn-ghost" id="prev-btn" aria-label="Go to previous field">
              ← Previous
            </button>
            <button class="btn btn-secondary btn-sm" id="skip-btn" aria-label="Skip this field">
              Skip
            </button>
            <button class="btn btn-primary" id="next-btn" aria-label="Save answer and go to next field">
              Next →
            </button>
          </div>
        </main>

        <!-- Field sidebar (desktop) -->
        <aside class="field-sidebar" aria-label="Form fields overview" id="field-sidebar">
          <p class="field-sidebar-title">All Fields</p>
          <div id="sidebar-list">
            <!-- Rendered by form.js -->
          </div>
        </aside>

      </div>

    </div>
  </div>

  <!-- Toast -->
  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/form.js"></script>
</body>
</html>
